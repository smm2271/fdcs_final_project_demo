<div class="page-container">
    <a class="back-link" routerLink="/articles">← 文章列表</a>

    <h1>{{ title || '文章' }}</h1>

    @if (isLoading) {

    <div class="status">載入中...</div>
    }
    @if (error) {
    <div class="status error">{{ error }}</div>
    }
    @if (violations.length) {

    <h2>已封鎖的連結或圖片</h2>
    <p>為避免跨資料夾渲染，以下項目已被移除：</p>
    <ul>
        @for (item of violations; track $index) {
        <li>{{ item }}</li>
        }
    </ul>
    }

    @if (!isLoading && !error) {
    <article class="markdown" [innerHTML]="html" (click)="onContentClick($event)">
    </article>
    }
</div>
